[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "simulador-planificacion"
version = "0.1.0"
description = "Simulador académico de planificación de procesos y atención de tiquetes"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "plotly>=5.24",
    "streamlit>=1.40",
]

[project.optional-dependencies]
desarrollo = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
include = ["simulador*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", ".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]


